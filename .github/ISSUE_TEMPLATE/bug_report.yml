name: Relato de bug
description: Informe um erro reproduzível no laboratório AYANODE
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Inclua semente, parâmetros e ações usadas.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Sistema, navegador ou versão do Node.js"
